<!DOCTYPE html>
<html>
<head>
    <title>Target Information</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Target Information</h1>
        <form id="target-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="address">Target Address:</label>
                <input type="text" class="form-control" id="address" placeholder="Enter target address">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <div id="target-info"></div>
    </div>
    <script>
    $(document).ready(function() {
        $('#target-form').on('submit', function(e) {
            e.preventDefault();
            var address = $('#address').val();
            $.ajax({
                url: 'http://badsectorDB.pythonanywhere.com/targets/target_details/',
                type: 'POST',
                data: JSON.stringify({
                    "address": address
                }),
                contentType: 'application/json',
                beforeSend: function(xhr) {
                    xhr.setRequestHeader('X-CSRFToken', $.cookie('csrftoken'));
                },
                success: function(data) {
                    $('#target-info').html('<pre>' + JSON.stringify(data, null, 2) + '</pre>');
                },
                error: function() {
                    $('#target-info').html('<div class="alert alert-danger">An error occurred.</div>');
                }
            });
        });
    });
    </script>
</body>
</html>
